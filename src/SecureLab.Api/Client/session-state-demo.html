<!doctype html>
<html lang="uk"><meta charset="utf-8"><title>Стан cookie-сеансу</title>
<h1>Стан cookie-сеансу</h1>
<p id="status">Перевірка…</p>
<label>Ім'я користувача <input id="username"></label>
<label>Пароль <input id="password" type="password"></label>
<button id="login-btn">Увійти</button>
<br><br>
<button id="logout-btn">Вийти</button>
<script>
  const statusEl = document.querySelector("#status");

  async function checkSession() {
    const res = await fetch("/api/auth/session-check");
    statusEl.textContent = res.ok ? "Увійшли." : "Не ввійшли.";
  }

  document.querySelector("#login-btn").addEventListener("click", async () => {
    const userName = document.querySelector("#username").value;
    const password = document.querySelector("#password").value;
    await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userName, password }),
    });
    document.querySelector("#password").value = "";
    await checkSession();
  });

  document.querySelector("#logout-btn").addEventListener("click", async () => {
    await fetch("/api/auth/logout", { method: "POST" });
    await checkSession();
  });

  checkSession();
</script>
</html>
